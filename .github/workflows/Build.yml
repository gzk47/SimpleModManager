name: Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write

    steps:
      - name: Add safe.directory Update libnx
        run: |
          git config --global --add safe.directory "*"
          # git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          # cd libnx
          # make -j$(nproc) install

      - name: Checkout latest code
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Clone submodules
        run: |
          rm -rf submodules
          mkdir -p submodules
          git clone https://github.com/nadrino/borealis submodules/borealis
          git clone https://github.com/nadrino/cpp-generic-toolbox.git submodules/cpp-generic-toolbox
          git clone https://github.com/nadrino/libtesla.git submodules/libtesla
          git clone https://github.com/nadrino/simple-cpp-logger.git submodules/simple-cpp-logger

      - name: Extract version
        run: |
          APP_NAME="SimpleModManager"
          VER_FILE="CMakeLists.txt"
          KEY="set(VERSION_"
          
          VERSION="$(grep -F "$KEY" "$VER_FILE" | grep -oE '[0-9]+' | head -3 | paste -s -d '.')"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          echo "TAG_NAME=v${VERSION}-${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${APP_NAME} v${VERSION} (${SHORT_HASH})" >> "$GITHUB_ENV"

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=cmake/devkita64-libnx.cmake ..
          make -j$(nproc)

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            build/src/Applications/SimpleModManager/SimpleModManager.nro
